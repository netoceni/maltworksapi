name: D1 read-only diagnostics

# Manual execution only. This workflow never deploys or changes D1 data.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maltworks-d1-readonly-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    name: Inspect production D1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read-only D1 measurements
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p d1-diagnostics

          # This command requests metadata only.
          npx wrangler d1 info maltworks-recovery-20261027 --json \
            | tee d1-diagnostics/database.json

          # Each SQL statement below is SELECT-only.
          npx wrangler d1 execute DB --remote --json \
            --command "SELECT unixepoch('now') AS sampled_at,
              (SELECT COUNT(*) FROM telemetry) AS total_rows,
              (SELECT COUNT(*) FROM telemetry
                WHERE received_at >= unixepoch('now') - 86400) AS rows_last_24h,
              (SELECT COUNT(*) FROM telemetry
                WHERE received_at >= unixepoch('now') - 3600) AS rows_last_hour,
              (SELECT COUNT(*) FROM telemetry
                WHERE received_at >= unixepoch('now') - 3600) * 24 AS hourly_projected_rows_per_day,
              (SELECT COUNT(*) FROM telemetry
                WHERE received_at >= unixepoch('now') - 3600) * 72 AS hourly_estimated_minimum_writes_per_day,
              (SELECT COUNT(DISTINCT device_id) FROM telemetry
                WHERE received_at >= unixepoch('now') - 86400) AS active_devices_24h,
              (SELECT COUNT(*) FROM telemetry
                WHERE received_at < unixepoch('now') - 604800) AS expired_rows_7d,
              (SELECT MIN(received_at) FROM telemetry) AS oldest_received_at,
              (SELECT MAX(received_at) FROM telemetry) AS newest_received_at;" \
            | tee d1-diagnostics/telemetry.json

          # Confirm whether the daily 09:05 BRT monitor actually saved data.
          # No user or device identifiers are exported from this public workflow.
          npx wrangler d1 execute DB --remote --json \
            --command "SELECT day_utc, sampled_at, size_bytes,
                     telemetry_rows, rows_last_24h, expired_rows, level
                  FROM d1_health_daily
                 ORDER BY day_utc DESC LIMIT 7;" \
            | tee d1-diagnostics/health.json

          # PRAGMA index_list only reads index metadata.
          npx wrangler d1 execute DB --remote --json \
            --command "PRAGMA index_list('telemetry');" \
            | tee d1-diagnostics/indexes.json

          {
            echo "## D1 production diagnostics"
            echo ""
            echo 'Database: `maltworks-recovery-20261027`'
            echo ""
            echo "### Database size"
            echo '```json'
            cat d1-diagnostics/database.json
            echo '```'
            echo ""
            echo "### Telemetry volume and age (Unix timestamps in seconds)"
            echo '```json'
            cat d1-diagnostics/telemetry.json
            echo '```'
            echo ""
            echo "### Last seven D1 health snapshots"
            echo 'Datas anteriores ao primeiro monitoramento podem nao existir.'
            echo 'O snapshot real de hoje confirma a execucao do cron; workflow verde sozinho nao comprova coleta.'
            echo 'Binario de diagnostico e apenas SELECT; nao executa alerta nem limpeza.'
            echo 'Para estimativas de ingestao: 24 x amostras da ultima hora; escritas MINIMAS = 72 x amostras da ultima hora.'
            echo 'Cota D1 Free: 100.000 linhas gravadas/dia. Amostras removiveis pela politica atual: 36.000/dia.'
            echo ""
            echo '~~~json'
            cat d1-diagnostics/health.json
            echo '~~~'
            echo ""
            echo "### Indexes"
            echo '```json'
            cat d1-diagnostics/indexes.json
            echo '```'
            echo ""
            echo "Retention removal ceiling: 250 records / 10 min = 36,000 records / day."
            echo ""
            echo "All statements executed by this workflow are read-only."
          } >> "$GITHUB_STEP_SUMMARY"
