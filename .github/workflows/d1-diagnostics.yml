name: D1 read-only diagnostics

# Manual execution only. This workflow never deploys or changes D1 data.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maltworks-d1-readonly-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    name: Inspect production D1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read-only D1 measurements
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p d1-diagnostics

          # This command requests metadata only.
          npx wrangler d1 info maltworks-recovery-20261027 --json \
            | tee d1-diagnostics/database.json

          # Each SQL statement below is SELECT-only.
          npx wrangler d1 execute DB --remote --json \
            --command "SELECT unixepoch('now') AS sampled_at,
              (SELECT COUNT(*) FROM telemetry) AS total_rows,
              (SELECT COUNT(*) FROM telemetry
                WHERE received_at >= unixepoch('now') - 86400) AS rows_last_24h,
              (SELECT COUNT(*) FROM telemetry
                WHERE received_at < unixepoch('now') - 604800) AS expired_rows_7d,
              (SELECT MIN(received_at) FROM telemetry) AS oldest_received_at,
              (SELECT MAX(received_at) FROM telemetry) AS newest_received_at;" \
            | tee d1-diagnostics/telemetry.json

          # PRAGMA index_list only reads index metadata.
          npx wrangler d1 execute DB --remote --json \
            --command "PRAGMA index_list('telemetry');" \
            | tee d1-diagnostics/indexes.json

          {
            echo "## D1 production diagnostics"
            echo ""
            echo "Database: `maltworks-recovery-20261027`"
            echo ""
            echo "### Database size"
            echo '```json'
            cat d1-diagnostics/database.json
            echo '```'
            echo ""
            echo "### Telemetry volume and age (Unix timestamps in seconds)"
            echo '```json'
            cat d1-diagnostics/telemetry.json
            echo '```'
            echo ""
            echo "### Indexes"
            echo '```json'
            cat d1-diagnostics/indexes.json
            echo '```'
            echo ""
            echo "Retention removal ceiling: 250 records / 10 min = 36,000 records / day."
            echo ""
            echo "All statements executed by this workflow are read-only."
          } >> "$GITHUB_STEP_SUMMARY"
