name: Validate API PR

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: TypeScript and D1 tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run check
      - name: Run tests against isolated D1
        run: npm test
      - name: Smoke-test local SQLite fleet simulator
        run: |
          python3 scripts/simulate_history_capacity.py \
            --devices 1,5,25 \
            --payload-bytes 900 \
            --event-percent 2 \
            --output /tmp/maltworks-history-simulation.json > /dev/null
          python3 -c "import json; p=json.load(open('/tmp/maltworks-history-simulation.json')); s=p['scenarios']; assert len(s)==3; f=next(x for x in s if x['devices']==25); assert f['raw_backlog_growth_day']==0; assert f['http_requests_day']>f['workers_free_request_limit_day']"
