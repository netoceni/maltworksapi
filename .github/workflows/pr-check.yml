name: Validate API PR

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: TypeScript and D1 tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test production approval guard without network access
        run: node --test scripts/production-approval.spec.mjs
      - name: Check TypeScript
        run: npm run check
      - name: Run tests against isolated D1
        run: npm test
      - name: Test internal Maltworks Lab and staging security gates
        run: node --test scripts/maltworks-lab*.spec.mjs
      - name: Smoke-test local SQLite fleet simulator
        run: |
          python3 scripts/simulate_history_capacity.py \
            --devices 1,5,10 \
            --payload-bytes 900 \
            --event-percent 2 \
            --http-seconds 30 \
            --heartbeat-seconds 30 \
            --persist-seconds 180 \
            --output /tmp/maltworks-history-simulation.json
          python3 -c "import json; p=json.load(open('/tmp/maltworks-history-simulation.json')); s=p['scenarios']; assert len(s)==3; f=next(x for x in s if x['devices']==10); assert f['raw_backlog_growth_day']==0; assert f['http_requests_day']<=80000; assert f['do_total_requests_day']<=80000; assert f['d1_daily_writes_heuristic_estimate']<=80000; assert f['steady_db_mb_projection']<=400"

  windows-websocket:
    name: Windows Lab and WebSocket regression (Node ${{ matrix.node }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Show Windows runtime and source hash
        shell: pwsh
        run: |
          node --version
          npm --version
          # Exercise the imported CLI with Windows autocrlf, respecting .gitattributes.
          git -c core.autocrlf=true checkout-index --force scripts/maltworks-lab.mjs
          git ls-files --eol scripts/maltworks-lab.mjs
          git hash-object test/realtime-online.integration.spec.ts
          node --check scripts/maltworks-lab.mjs
      - name: Run all Worker tests, including Lab contract and WebSocket regressions
        run: npm test
      - name: Test internal Maltworks Lab and staging security gates
        run: node --test scripts/maltworks-lab*.spec.mjs
      - name: Regression for an unresponsive WebSocket close handshake
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-lab-socket-cleanup.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-lab-socket-cleanup.ps1 -LabScriptName 06-websocket-lab.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-lab-process-exit.ps1
