name: Validate API PR

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: TypeScript and D1 tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run check
      - name: Run tests against isolated D1
        run: npm test
      - name: Test internal Maltworks Lab and staging security gates
        run: node --test scripts/maltworks-lab*.spec.mjs
      - name: Smoke-test local SQLite fleet simulator
        run: |
          python3 scripts/simulate_history_capacity.py \
            --devices 1,5,10 \
            --payload-bytes 900 \
            --event-percent 2 \
            --http-seconds 30 \
            --heartbeat-seconds 30 \
            --persist-seconds 180 \
            --output /tmp/maltworks-history-simulation.json
          python3 -c "import json; p=json.load(open('/tmp/maltworks-history-simulation.json')); s=p['scenarios']; assert len(s)==3; f=next(x for x in s if x['devices']==10); assert f['raw_backlog_growth_day']==0; assert f['http_requests_day']<=80000; assert f['do_total_requests_day']<=80000; assert f['d1_daily_writes_heuristic_estimate']<=80000; assert f['steady_db_mb_projection']<=400"

  windows-websocket:
    name: Windows WebSocket regression
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Show Windows runtime and source hash
        shell: pwsh
        run: |
          node --version
          npm --version
          git hash-object test/realtime-online.integration.spec.ts
          node --check scripts/maltworks-lab.mjs
      - name: Run only WebSocket regression suite
        run: npm run test:realtime
      - name: Diagnose module-load failure with temporary minimal probes
        if: failure()
        shell: pwsh
        run: |
          $source = Get-Content -LiteralPath "test/realtime-online.integration.spec.ts" -Raw
          $split = $source.IndexOf('describe("Realtime device recovery')
          if ($split -lt 0) { throw "Source anchor not found" }
          $header = $source.Substring(0, $split)
          $basic = 'import { describe, it, expect } from "vitest"; describe("smoke", () => { it("ok", () => { expect(1).toBe(1); }); });'
          $rest = 'describe("smoke", () => { it("ok", () => { expect(1).toBe(1); }); });'
          $cf = 'import { env, exports } from "cloudflare:workers";'
          $index = 'import "../src/index";'
          $notify = 'import { recordDeviceOnline, recordOfflineDevice } from "../src/notifications";'
          $simulator = 'import { labDeviceId, makeLabTelemetry } from "../scripts/maltworks-lab.mjs";'
          $firstHelper = $header.IndexOf("async function transmit")
          $secondHelper = $header.IndexOf("async function onlineCount")
          $thirdHelper = $header.IndexOf("async function offlineActive")
          if ($firstHelper -lt 0 -or $secondHelper -lt 0 -or $thirdHelper -lt 0) {
            throw "Function anchors missing from test source"
          }
          $imports = $cf + "`n" + $index + "`n" + $notify + "`n" + $simulator + "`n"
          $baseConst = 'const BASE = "https://api-staging.maltworks.com.br";'
          $idConst = 'const DEVICE_ID = labDeviceId(1);'
          $tokenConst = 'const TOKEN = "ce".repeat(32);'
          $cases = @(
            @{ label = "only-base-constant"; content = ($imports + $baseConst + "`n" + $basic) },
            @{ label = "only-device-id-constant"; content = ($imports + $idConst + "`n" + $basic) },
            @{ label = "only-token-constant"; content = ($imports + $tokenConst + "`n" + $basic) },
            @{ label = "all-three-constants"; content = ($imports + $baseConst + "`n" + $idConst + "`n" + $tokenConst + "`n" + $basic) },
            @{ label = "original-header-constants"; content = ($header.Substring(0, $firstHelper) + "`n" + $rest) },
            @{ label = "original-header-no-comment"; content = ((($header.Substring(0, $firstHelper)) -replace '// @ts-expect-error[^\\r\\n]+\\r?\\n','') + "`n" + $rest) }
          )
          foreach ($case in $cases) {
            Write-Host ("DIAGNOSTIC CASE: " + $case.label)
            [System.IO.File]::WriteAllText(
              (Join-Path (Get-Location) "test/ws-probe.integration.spec.ts"),
              $case.content,
              [System.Text.UTF8Encoding]::new($false)
            )
            & npx.cmd vitest run test/ws-probe.integration.spec.ts --maxWorkers=1 --no-isolate
            Write-Host ("DIAGNOSTIC RESULT: " + $case.label + " exit=" + $LASTEXITCODE)
          }
